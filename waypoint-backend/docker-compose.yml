services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
      POSTGRES_DB: waypoint
    ports:
      # Bound to loopback only — 0.0.0.0 would put an unauthenticated
      # Postgres on the LAN. Anyone on the same network reaching this port
      # can already connect with the well-known waypoint/waypoint
      # credentials; don't also hand them the network path.
      #
      # Host side is 15432, not Postgres's own 5432 default — picked to
      # avoid colliding with another project's Postgres already claiming
      # the standard port on the same dev machine. The container's own
      # internal port stays 5432 (unchanged below and in the healthcheck) —
      # only the host-published side needed to move.
      - '127.0.0.1:15432:5432'
    volumes:
      - waypoint_pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h forces a TCP connection. Without it, pg_isready checks the local
      # Unix socket, which comes up during postgres:16-alpine's initdb
      # phase *before* the server is actually accepting connections —
      # letting `depends_on: condition: service_healthy` go green early and
      # race the api container's first migration attempt.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U waypoint -d waypoint']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    environment:
      # The compose network resolves service names as hostnames — this is
      # deliberately not `localhost` (that's what .env is for when running
      # `npm run dev` on the host against the container's published port).
      DATABASE_URL: postgres://waypoint:waypoint@postgres:5432/waypoint
      # 14000, not Express's conventional 4000 — same reasoning as the
      # postgres service's host port above (a machine-local conflict with
      # another project). Changed on both sides here (unlike postgres,
      # which only moved its host-published port) so the app's own PORT
      # env, this mapping, and every doc/URL referencing "the backend" all
      # say the same number — nothing internal needs 4000 specifically the
      # way postgres's default port is baked into the image/healthcheck.
      PORT: 14000
      # 0.0.0.0, not index.ts's loopback default — a process bound to
      # 127.0.0.1 *inside* this container is unreachable through the
      # 127.0.0.1:14000:14000 publish rule below (that rule forwards to the
      # container's internal network, not to loopback inside it). This is
      # safe here for the same reason the postgres service above binds wide
      # inside its own container: Docker's network namespace plus this
      # service's own host-side 127.0.0.1 publish rule are what actually
      # keep it off the LAN, not the in-container bind address.
      HOST: 0.0.0.0
      #
      # --- Everything below is what a self-hoster actually configures on
      # day one (docs/design/self-hosted-auth-and-multitenancy.md §8) —
      # unlike DATABASE_URL/PORT/HOST above, these use Compose's ${...}
      # substitution, which Compose fills in from a `waypoint-backend/.env`
      # file if one exists (see setup docs at
      # docs/operations/self-hosted-setup.md) or from your shell
      # environment. Leaving all of them unset is a supported, honest
      # failure mode, not a bug: POST /instance/setup answers 503 without
      # INSTANCE_SETUP_TOKEN, and refuses to complete without at least one
      # sign-in method below — an instance with nothing configured simply
      # can't produce an account anyone could sign into.
      #
      # First-run setup is gated on this token (spec §4/§8): whoever holds
      # it owns the instance, the same trust boundary as DATABASE_URL
      # above. Generate your own — this is not a value we issue.
      INSTANCE_SETUP_TOKEN: ${INSTANCE_SETUP_TOKEN:-}
      #
      # Sign-in methods (§8) — each pair below is independently optional;
      # at least one full pair (or SMTP_HOST+SMTP_FROM) must be set. A
      # GitHub OAuth App and a Google Cloud OAuth client are both free,
      # self-service, five-minute registrations you make yourself — see
      # the setup docs for exactly what to register and what callback URL
      # to give each provider.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # SMTP_PORT/SMTP_USER/SMTP_PASS are optional beyond SMTP_HOST/
      # SMTP_FROM — a local, unauthenticated relay needs none of them.
      # Port 465 is implicit TLS; anything else starts plain and upgrades
      # with STARTTLS.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      #
      # The URL GitHub/Google send the browser back to, and the magic link
      # points at — this backend as your team actually reaches it, not as
      # this container sees itself. Defaults to http://localhost:<PORT>,
      # which is only correct for local dev against the published port
      # above; set this once you put your own reverse proxy/TLS in front
      # of this container (see the loopback-only note on the port mapping
      # below — that part of this file is unchanged by this epic, and
      # putting this instance on a real network is deliberately your own
      # infra decision, not something this compose file does for you).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      #
      # Encryption key for a hosted member's own Jira credential (AT12) —
      # optional, and normally left unset: a 32-byte key is generated on
      # first use. Pointed at the waypoint_secrets volume below rather
      # than left at its container-filesystem default so it survives a
      # rebuild/recreate; every stored credential opens under whichever
      # key answers at this path, so losing the volume is equivalent to
      # every Team member's stored Jira connection needing to be redone —
      # survivable, but worth the one-line fix of persisting it.
      WAYPOINT_KEY_FILE: /data/secrets/secret.key
    volumes:
      - waypoint_secrets:/data/secrets
    ports:
      - '127.0.0.1:14000:14000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  waypoint_pgdata:
  waypoint_secrets:
