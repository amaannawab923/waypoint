services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
      POSTGRES_DB: waypoint
    ports:
      - '5432:5432'
    volumes:
      - waypoint_pgdata:/var/lib/postgresql/data

volumes:
  waypoint_pgdata:
