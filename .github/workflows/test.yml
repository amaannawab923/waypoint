name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: Unit & component tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: waypoint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: waypoint-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck --if-present
      # continue-on-error, not a hard gate: this is the first time lint has
      # ever run in CI for this repo (no workflow existed before this PR),
      # and it surfaces 100+ pre-existing violations across files this PR
      # never touched. Reporting it now without blocking every future PR on
      # unrelated legacy debt; tightening this to a hard gate is a real,
      # separate follow-up once that debt is paid down.
      - run: npm run lint
        continue-on-error: true
      - run: npm test

  e2e:
    name: Electron E2E (Playwright)
    # macos-latest, to actually build/run the real Electron app — but
    # GitHub's macOS runners have no Docker at all (confirmed live: the
    # `services:` block this job used to have failed instantly with
    # "docker: command not found"), so the backend's own
    # docker-compose.yml isn't usable here. Postgres is installed and run
    # directly via Homebrew instead — the backend's own DATABASE_URL
    # default (.env.example) already points at a plain local Postgres on
    # 5432, which is exactly what this sets up.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: waypoint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: waypoint-frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Set up Postgres (Homebrew, no Docker on this runner)
        run: |
          brew install postgresql@16
          export PATH="/opt/homebrew/opt/postgresql@16/bin:$PATH"
          brew services start postgresql@16
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 && break
            sleep 1
          done
          createuser -s waypoint
          createdb -O waypoint waypoint
          psql -c "ALTER ROLE waypoint WITH PASSWORD 'waypoint';"
      - name: Install and start the backend API
        working-directory: waypoint-backend
        run: |
          npm ci
          cp .env.example .env
          npm run db:migrate --if-present
          npm run build
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && break
            sleep 2
          done
      - name: Run E2E suite
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: waypoint-frontend/test-results
          retention-days: 7
